<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unirme al equipo · Worktic AI</title><meta name="theme-color" content="#0a0a12"><link rel="icon" type="image/png" href="/assets/favicon-32.png"><link rel="apple-touch-icon" href="/assets/favicon-180.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css">
<style>.lang-switch-invite{position:absolute;top:18px;right:18px;background:var(--paper-2);border:1px solid var(--line-2);color:var(--text-soft);padding:6px 12px;border-radius:999px;font-size:11.5px;font-weight:800;box-shadow:none;min-height:auto}.invite-card{position:relative}</style>
</head><body class="auth-premium"><main class="invite-shell"><section class="invite-card"><button type="button" class="lang-switch-invite" data-lang-switch>EN</button><div class="brand invite-brand"><img src="/assets/logo-mark.png" alt="Worktic AI" class="brand-mark"><div><b>Worktic AI</b><small data-i18n="invite.tagline">Invitación segura de equipo</small></div></div><div id="inviteState" class="invite-state"><div class="skeleton-block"></div></div><form id="acceptInviteForm" class="form" hidden><div class="invite-heading"><span class="eyebrow" data-i18n="invite.eyebrow">INVITACIÓN EMPRESARIAL</span><h1><span data-i18n="invite.join_prefix">Únete a</span> <span id="inviteCompany"></span></h1><p data-i18n="invite.desc">Completa tus datos para ingresar al espacio de trabajo correcto.</p></div><div class="invite-summary"><div><small data-i18n="invite.role_label">Rol asignado</small><b id="inviteRole"></b></div><div><small data-i18n="invite.area_label">Área</small><b id="inviteArea"></b></div></div><label><span data-i18n="invite.name_label">Tu nombre</span><input id="inviteName" required autocomplete="name"></label><label><span data-i18n="invite.email_label">Correo de acceso</span><input id="inviteEmail" type="email" required autocomplete="email"></label><label><span data-i18n="invite.password_label">Crea una contraseña</span><input id="invitePassword" type="password" minlength="8" required autocomplete="new-password"></label><button id="acceptInviteBtn" data-i18n="invite.accept_btn">Aceptar invitación</button><p class="form-help" data-i18n="invite.help">Al continuar, tu usuario quedará ligado a la licencia y datos de esta empresa.</p></form></section></main><div id="toast" class="toast"></div><script src="/i18n.js"></script><script src="/invite.js"></script></body></html>

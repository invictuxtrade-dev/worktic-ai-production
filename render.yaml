services:
  - type: keyvalue
    name: worktic-cache
    plan: 256mb
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot

  - type: web
    name: worktic-ai
    runtime: docker
    plan: 1c-2g
    dockerfilePath: ./Dockerfile
    healthCheckPath: /readyz
    autoDeployTrigger: "off"
    disk:
      name: worktic-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: Worktic AI
      - key: DATA_DIR
        value: /var/data
      - key: BASE_URL
        sync: false

      # Primary SaaS database (V26)
      - key: DATABASE_DRIVER
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: worktic-db
          property: connectionString

      # Redis-compatible coordination / rate limiting
      - key: REDIS_URL
        fromService:
          name: worktic-cache
          type: keyvalue
          property: connectionString
      - key: REDIS_REQUIRED
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: BACKGROUND_WORKERS_ENABLED
        value: "true"
      - key: CHANNEL_RUNTIMES_ENABLED
        value: "true"
      # Set to true for the first V26 migration deploy; set false only after migration verification.
      - key: MAINTENANCE_MODE
        sync: false
      - key: ALLOW_SQLITE_PRODUCTION
        value: "false"
      # Optional: comma-separated public hosts that Automation Engine webhooks may call.
      - key: AUTOMATION_WEBHOOK_ALLOWED_HOSTS
        sync: false

      # Legacy WhatsApp QR store remains on the persistent disk during V26
      - key: LEGACY_WHATSAPP_DRIVER
        value: sqlite
      - key: LEGACY_WHATSAPP_DSN
        value: file:/var/data/worktic.db?_pragma=foreign_keys(1)&_pragma=busy_timeout(5000)

      - key: CHANNEL_ENCRYPTION_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini

      # Meta / Facebook / Instagram / Messenger / WhatsApp / Lead Ads
      - key: META_GRAPH_VERSION
        value: v25.0
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: MESSENGER_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: META_LEADS_VERIFY_TOKEN
        sync: false
      - key: META_WHATSAPP_CONFIG_ID
        sync: false
      - key: META_SYSTEM_USER_ACCESS_TOKEN
        sync: false

      # Other Social Hub providers
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: TIKTOK_CLIENT_KEY
        sync: false
      - key: TIKTOK_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

      # Ads Center V25
      - key: TIKTOK_BUSINESS_APP_ID
        sync: false
      - key: TIKTOK_BUSINESS_SECRET
        sync: false
      - key: TIKTOK_BUSINESS_AUTH_URL
        sync: false
      - key: GOOGLE_ADS_DEVELOPER_TOKEN
        sync: false

      # Optional Telegram channel
      - key: TELEGRAM_BOT_TOKEN
        sync: false

      # Billing
      - key: USDT_BEP20_ADDRESS
        sync: false
      - key: USDT_TRC20_ADDRESS
        sync: false
      - key: PAYMENT_CONFIRMATIONS
        value: "12"

      # Operational defaults
      - key: ALLOW_GROUP_MESSAGES
        value: "false"
      - key: MESSENGER_SYNC_ACTIVE_SECONDS
        value: "10"
      - key: MESSENGER_SYNC_IDLE_SECONDS
        value: "60"
      - key: MESSENGER_TOKEN_CHECK_HOURS
        value: "6"
      - key: MESSENGER_OUTBOX_MAX_ATTEMPTS
        value: "5"

databases:
  - name: worktic-db
    databaseName: worktic
    user: worktic
    plan: 0.5c-1g
    ipAllowList: []

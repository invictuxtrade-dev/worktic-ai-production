services:
  - type: web
    name: worktic-ai
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /readyz
    autoDeploy: true
    disk:
      name: worktic-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: Worktic AI
      - key: DATA_DIR
        value: /var/data
      - key: BASE_URL
        sync: false
      - key: CHANNEL_ENCRYPTION_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: MESSENGER_VERIFY_TOKEN
        generateValue: true
      - key: META_GRAPH_VERSION
        value: v24.0
      - key: USDT_BEP20_ADDRESS
        sync: false
      - key: USDT_TRC20_ADDRESS
        sync: false
      - key: ALLOW_GROUP_MESSAGES
        value: "false"
